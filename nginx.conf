# Конфигурация nginx для раздачи SPA-сборки APM-прототипа.
server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Сжатие текстовых ресурсов.
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;

    # Хешированные ассеты Vite неизменяемы — кешируем надолго.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # SPA-fallback: любые маршруты отдают index.html, чтобы работал React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html не кешируем, чтобы клиенты получали свежие ссылки на ассеты.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
